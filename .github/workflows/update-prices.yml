name: Update airfare data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual run button in the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVEL }}
        run: python3 scraper.py

      - name: Commit updated data
        run: |
          git config user.name "airfare-watch-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update airfare data"
          git push
